services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: raghilda
      POSTGRES_PASSWORD: raghilda
      POSTGRES_DB: raghilda_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raghilda"]
      interval: 2s
      timeout: 5s
      retries: 10
