name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: raghilda
          POSTGRES_PASSWORD: raghilda
          POSTGRES_DB: raghilda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raghilda"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.14
    
    - name: Install dependencies
      run: uv sync --all-extras --python 3.14
    
    - name: Run checks
      run: uv run task check
